services:
  - type: web
    name: social-media-nlp-ws
    runtime: node
    plan: free
    rootDir: BE-Social-Media
    buildCommand: npm ci --no-audit --no-fund && npm run build
    startCommand: node dist/main.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SKIP_API_PREFIX
        value: "true"
      - key: IS_PRODUCTION
        value: "true"
      - key: FRONTEND_URL
        value: "https://social-media-nlp.vercel.app"
      - key: CORS_ORIGINS
        value: "https://social-media-nlp.vercel.app"
      # Secrets — set in dashboard after apply (do not put values in this file)
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REFRESH_JWT_SECRET
        sync: false
